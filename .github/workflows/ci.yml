name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  OPENCODE_CLI_VERSION: "2.0.25"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: |
          bun run test:coverage 2>&1 | tee test-output.log
      - name: Publish coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage"
            echo ""
            echo '```'
            awk '/^-+\|/{table=1} table{print}' test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  v2-smoke:
    name: V2 Lifecycle Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install OpenCode V2
        run: npm install -g @opencode/cli@${OPENCODE_CLI_VERSION}
      - name: Assert OpenCode CLI version
        run: |
          OBSERVED="$(opencode2 --version)"
          test "$OBSERVED" = "opencode v${OPENCODE_CLI_VERSION}"
      - run: bun run smoke:v2
        env:
          OPENCODE_SMOKE_TIMEOUT_MS: "120000"
          OPENCODE_SMOKE_ARTIFACTS_DIR: ${{ runner.temp }}/smoke-artifacts
      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: v2-smoke-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
