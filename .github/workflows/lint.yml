name: Lint

on:
  pull_request:
  push:
    branches: [main, "release/**"]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: ./scripts/style.sh lint --ts

  lint-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: ./scripts/install-shellcheck.sh
      - run: ./scripts/style.sh lint --shell

  lint-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - run: npx --yes markdownlint-cli "**/*.md" --ignore-path .markdownlintignore
      - run: npx --yes prettier --check "**/*.{md,mdx,yaml,yml}" --ignore-path .prettierignore
